name: Publish to DEV.to

on:
  push:
    branches: [main]
    paths:
      - 'devto/**/*.md'
      - '.github/workflows/publish-to-devto.yml'
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図'
        required: false
        type: string
      create_drafts:
        description: 'Also create published: false articles missing on DEV.to (normally only when the push changed them)'
        required: false
        default: false
        type: boolean

# Two quick pushes must not both POST the same new article.
concurrency:
  group: publish-to-devto
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish articles to DEV.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
          BEFORE: ${{ github.event.before }}
          CREATE_DRAFTS: ${{ inputs.create_drafts }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e  # GitHub Actions uses bash -e; disable to process all articles even if one fails
          failed=0
          created=0
          updated=0
          skipped=0
          unchanged=0

          # List every article of one kind, page by page. Prints a JSON array, or returns 1.
          # A failed or partial listing must stop the run: every file missing from it would be POSTed as a duplicate.
          list_articles() {
            local kind=$1 page=1 all='[]' resp status body
            while :; do
              resp=$(curl -s --max-time 60 -w "\n__HTTP_STATUS__:%{http_code}" \
                "https://dev.to/api/articles/me/$kind?per_page=1000&page=$page" \
                -H "api-key: $DEVTO_API_KEY")
              status=$(printf '%s\n' "$resp" | sed -n 's/^__HTTP_STATUS__://p')
              body=$(printf '%s\n' "$resp" | grep -v "^__HTTP_STATUS__:")
              if [ "$status" != "200" ] || ! printf '%s' "$body" | jq -e 'type == "array"' >/dev/null 2>&1; then
                echo "::error::listing articles/me/$kind page $page failed (status $status)" >&2
                return 1
              fi
              all=$(jq -s 'add' <<<"$all $body")
              # Stop on an empty page, not a short one: DEV.to may cap per_page below 1000.
              [ "$(jq length <<<"$body")" -eq 0 ] && break
              page=$((page + 1))
            done
            printf '%s' "$all"
          }

          list_existing() {
            local pub unpub
            pub=$(list_articles published) || return 1
            unpub=$(list_articles unpublished) || return 1
            jq -s 'add' <<<"$pub $unpub"
          }

          # Fetch all existing articles (published + unpublished/drafts)
          if ! existing=$(list_existing); then
            echo "::error::could not list existing DEV.to articles; stopping so nothing is created twice"
            exit 1
          fi
          echo "Existing articles on DEV.to: $(jq length <<<"$existing")"

          # Files added or changed by this push (empty for workflow_dispatch or a new branch).
          changed=""
          diff_ok=false
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if changed=$(git diff --no-renames --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- devto/) \
              && workflow_changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- .github/workflows/publish-to-devto.yml); then
              # A change to this workflow may change what is sent, so it re-sends everything.
              [ -z "$workflow_changed" ] && diff_ok=true
            else
              echo "::warning::could not diff $BEFORE..$GITHUB_SHA; missing drafts will not be created this run"
              changed=""
            fi
          fi
          # On a push whose diff is known, articles already on DEV.to are sent only when the push changed them.
          # Re-sending all ~50 unchanged articles took 5 minutes and one transient DEV.to 500 on any of them failed the run.
          # workflow_dispatch (or an unknown diff) still re-sends everything.
          only_changed=false
          if [ "$EVENT_NAME" = "push" ] && [ "$diff_ok" = true ]; then
            only_changed=true
          fi
          echo "Only changed files: $only_changed"

          # Send one request, retrying 429 / 5xx / network errors with backoff.
          # Sets http_status and response_body.
          # A POST is retried only after re-listing shows the article was not created by the failed attempt.
          send() {
            local method=$1 url=$2 attempt=1 wait=15 response found
            while :; do
              response=$(curl -s --max-time 120 -w "\n__HTTP_STATUS__:%{http_code}" -X "$method" "$url" \
                -H "Content-Type: application/json" \
                -H "api-key: $DEVTO_API_KEY" \
                -d "$json_payload")
              http_status=$(printf '%s\n' "$response" | sed -n 's/^__HTTP_STATUS__://p')
              response_body=$(printf '%s\n' "$response" | grep -v "^__HTTP_STATUS__:")
              case "$http_status" in
                429|5??|000|"") ;;
                *) return 0 ;;
              esac
              if [ "$attempt" -ge 4 ]; then
                return 0
              fi
              if [ "$method" = "POST" ] && [ "$http_status" != "429" ] && [ "$wait" -lt 60 ]; then
                wait=60  # a POST that timed out may still be processing; give it time to appear before re-listing
              fi
              echo "  HTTP Status: ${http_status:-none} (attempt $attempt), retrying in ${wait}s"
              sleep "$wait"
              if [ "$method" = "POST" ] && [ "$http_status" != "429" ]; then
                if ! existing=$(list_existing); then
                  echo "  could not re-list articles; not retrying the POST"
                  return 0
                fi
                found=$(jq -r --arg t "$title" '.[] | select(.title == $t) | .url // empty' <<<"$existing" | head -n 1)
                if [ -n "$found" ]; then
                  echo "  the failed POST created the article anyway"
                  http_status=201
                  response_body=$(jq -n --arg u "$found" '{url: $u}')
                  return 0
                fi
              fi
              attempt=$((attempt + 1))
              wait=$((wait * 2))
            done
          }

          # Titles of all current files, to tell a renamed title from one another file took over.
          current_titles=$(for f in devto/*.md; do
            awk '/^---$/{n++; next} n==1{print} n>=2{exit}' "$f" | sed -n 's/^title: *//p' | sed 's/^"//; s/"$//'
          done)

          for file in devto/*.md; do
            echo "=== Processing $file ==="

            # Extract fields from the frontmatter only, so body lines like "title: ..." are ignored
            # (strip optional surrounding quotes)
            fm=$(awk '/^---$/{n++; next} n==1{print} n>=2{exit}' "$file")
            title=$(sed -n 's/^title: *//p' <<<"$fm" | sed 's/^"//; s/"$//')
            description=$(sed -n 's/^description: *//p' <<<"$fm" | sed 's/^"//; s/"$//')
            tags=$(sed -n 's/^tags: *//p' <<<"$fm")
            canonical_url=$(sed -n 's/^canonical_url: *//p' <<<"$fm")
            cover_image=$(sed -n 's/^cover_image: *//p' <<<"$fm")
            published_raw=$(sed -n 's/^published: *//p' <<<"$fm")
            is_published=$([ "$published_raw" = "false" ] && echo "false" || echo "true")

            # Extract body: skip lines until second '---', then print the rest
            body=$(awk 'BEGIN{n=0} /^---$/{n++; next} n>=2{print}' "$file")

            if [ -z "$body" ]; then
              echo "  Warning: empty body, skipping"
              skipped=$((skipped + 1))
              continue
            fi

            # Check if article with same title already exists
            article_id=$(echo "$existing" | jq -r --arg t "$title" \
              '.[] | select(.title == $t) | .id // empty' 2>/dev/null | head -n 1)

            # Articles are matched by title, so a push that changes the title would otherwise create a second article.
            # Look the article up under the titles this file had earlier in git history (newest first),
            # so a rename is applied even when the run that should have applied it failed or the run is a manual dispatch.
            # No --follow: rename detection by similarity can tie a new file to another article and overwrite it.
            # (A push that changes both the path and the title still creates a new article.)
            renamed_title=false
            if [ -z "$article_id" ]; then
              while IFS= read -r old_title; do
                [ -z "$old_title" ] && continue
                [ "$old_title" = "$title" ] && continue
                # If a current file carries that title, that article belongs to it.
                printf '%s\n' "$current_titles" | grep -qxF -- "$old_title" && continue
                article_id=$(jq -r --arg t "$old_title" '.[] | select(.title == $t) | .id // empty' <<<"$existing" | head -n 1)
                if [ -n "$article_id" ]; then
                  echo "  Title changed; updating the article found under an earlier title: $old_title"
                  renamed_title=true
                  break
                fi
              done < <(git log -p --format= -- "$file" 2>/dev/null \
                | sed -n 's/^[-+]title: *//p' | sed 's/^"//; s/"$//' | awk '!seen[$0]++')
            fi

            if [ -n "$article_id" ] && [ "$only_changed" = true ] && [ "$renamed_title" = false ] && ! printf '%s\n' "$changed" | grep -qxF "$file"; then
              echo "  Unchanged in this push (id: $article_id), not sent"
              unchanged=$((unchanged + 1))
              continue
            fi

            # A published: false file is created on DEV.to only when this push added or changed it.
            # Otherwise a draft deleted on DEV.to would be created again on every run.
            if [ -z "$article_id" ] && [ "$is_published" = "false" ] && [ "$CREATE_DRAFTS" != "true" ] && ! printf '%s\n' "$changed" | grep -qxF "$file"; then
              echo "  Skipped: published: false, not on DEV.to, and not changed in this push (not re-creating a deleted draft)"
              skipped=$((skipped + 1))
              continue
            fi

            # Build JSON payload
            json_payload=$(jq -n \
              --arg title "$title" \
              --arg body "$body" \
              --arg description "$description" \
              --arg tags "$tags" \
              --arg canonical "$canonical_url" \
              --arg cover "$cover_image" \
              --arg published "$is_published" \
              '{article: {
                title: $title,
                body_markdown: $body,
                description: $description,
                tags: ($tags | split(", ")),
                canonical_url: (if $canonical != "" then $canonical else null end),
                cover_image: (if $cover != "" then $cover else null end),
                published: ($published == "true")
              }}')

            if [ -n "$article_id" ]; then
              echo "  Updating existing article (id: $article_id)"
              send PUT "https://dev.to/api/articles/$article_id"
              sleep 5
            else
              echo "  Creating new article"
              send POST "https://dev.to/api/articles"
              sleep 30
            fi

            # Extract result URL
            result_url=$(echo "$response_body" | jq -r '.url // empty' 2>/dev/null || true)
            error_msg=$(echo "$response_body" | jq -r '.error // empty' 2>/dev/null || true)

            echo "  HTTP Status: $http_status"
            if [ -n "$result_url" ]; then
              echo "  URL: $result_url"
              if [ -n "$article_id" ]; then
                updated=$((updated + 1))
              else
                created=$((created + 1))
              fi
            elif [ -n "$error_msg" ]; then
              echo "  ERROR: $error_msg"
              failed=$((failed + 1))
            else
              echo "  WARNING: unexpected response (status $http_status)"
              failed=$((failed + 1))
            fi

          done

          echo ""
          echo "=== Summary ==="
          echo "  Created:   $created"
          echo "  Updated:   $updated"
          echo "  Unchanged: $unchanged"
          echo "  Skipped:   $skipped"
          echo "  Failed:    $failed"

          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed article(s) failed to publish"
            exit 1
          fi
